# ============================================================
#  WolfISMS-Stack – Betrieb hinter dem NPM-Container (gemeinsames Netz)
#  NPM erreicht die App über ${PROXY_ALIAS}. Ein fester Host-Port ist
#  optional (WOLFISMS_HOST_PORT in der .env).
#  Lizenz: ./license wird als Verzeichnis gemountet (Daten je Umgebung).
#    - Ohne customer.lic startet die App im Einzelusermodus.
#    - Der Lizenz-Upload im Admin-Bereich legt customer.lic dauerhaft ab.
#    - license-init kopiert license_public.pem beim ersten Start aus dem Image.
#  Datenbank: DB_MODUS in der .env wählt die eingebundene Datei
#    docker-compose.db-<DB_MODUS>.yml:
#      intern (Standard, auch wenn DB_MODUS fehlt) - MariaDB-Container "db"
#      extern  - kein DB-Container, DB_HOST/DB_PORT zeigen auf den Server
#    "include" und "depends_on.required" brauchen Docker Compose >= 2.20.
# ============================================================
include:
  - docker-compose.db-${DB_MODUS:-intern}.yml

services:

  # Einmaliger Init-Lauf: stellt sicher, dass license_public.pem im
  # Host-Verzeichnis ./license liegt (der Verzeichnis-Mount überdeckt
  # sonst die im Image mitgelieferte Datei).
  license-init:
    image: ${WOLFISMS_IMAGE:-wolfinfosecgmbh/wolfisms:release}
    entrypoint: ["/bin/sh", "-c",
      "[ -f /host-license/license_public.pem ] || cp /var/www/isms/license/license_public.pem /host-license/"]
    volumes:
      - ./license:/host-license
    restart: "no"

  app:
    image: ${WOLFISMS_IMAGE:-wolfinfosecgmbh/wolfisms:release}
    restart: unless-stopped
    depends_on:
      # required: false – bei DB_MODUS=extern ist "db" abgeschaltet,
      # die Abhängigkeit entfällt dann.
      db:
        condition: service_healthy
        required: false
      license-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # Leer bzw. nicht gesetzt = interner Container "db".
      DB_HOST: ${DB_HOST:-db}
      WOLFISMS_CONTAINER: "1"
    volumes:
      # Lizenzverzeichnis dieser Umgebung (customer.lic + license_public.pem):
      - ./license:/var/www/isms/license:rw
      # Hochgeladene Dateien - ohne Volume beim Neuanlegen des Containers weg:
      - uploads:/var/www/isms/wolfisms/uploads
      # Flask-Sessions inkl. .flask_secret_key - ohne Volume wird der Key neu
      # erzeugt und alle Benutzer sind nach einem Update ausgeloggt:
      - sessions:/var/www/isms/wolfisms/sessions
      # Hochgeladenes Branding (Logo, Header, Word-Vorlage, Briefpapier) -
      # ohne Volume liegt es nur in der Container-Schicht und ist nach jedem
      # Image-Update wieder auf die Auslieferungs-Defaults zurueckgesetzt:
      - branding:/var/www/isms/branding
      # CA-/Client-Zertifikate für eine externe DB mit TLS (DB_SSL_CA …),
      # getrennt von ./certs, das Schlüssel des Eigen-TLS-Modus enthält:
      - ./db-certs:/var/www/isms/db-certs:ro
    # Direkter Zugang ohne NPM (optional). Ohne WOLFISMS_HOST_PORT in der .env
    # vergibt Docker einen freien Port auf 127.0.0.1 – so kollidieren mehrere
    # Umgebungen auf einem Host nicht. Anzeigen: docker compose port app 8000
    ports:
      - "${WOLFISMS_HOST_BIND:-127.0.0.1}:${WOLFISMS_HOST_PORT:-}:8000"
    networks:
      default: {}
      proxy:
        aliases:
          - ${PROXY_ALIAS:?PROXY_ALIAS fehlt in der .env}

  cron:
    image: ${WOLFISMS_IMAGE:-wolfinfosecgmbh/wolfisms:release}
    restart: unless-stopped
    depends_on:
      # required: false – bei DB_MODUS=extern ist "db" abgeschaltet,
      # die Abhängigkeit entfällt dann.
      db:
        condition: service_healthy
        required: false
      license-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # Leer bzw. nicht gesetzt = interner Container "db".
      DB_HOST: ${DB_HOST:-db}
      WOLFISMS_CONTAINER: "1"
    volumes:
      - ./license:/var/www/isms/license:ro
      - ./db-certs:/var/www/isms/db-certs:ro
    entrypoint: ["/usr/local/bin/wolfisms-cron-entry.sh"]
    command: []
    networks:
      - default
    healthcheck:
      disable: true

networks:
  default:
  proxy:
    external: true
    name: proxy

volumes:
  uploads:
  sessions:
  branding:
